<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My trips — Maldives Liveaboard Booking</title><link rel="stylesheet" href="assets/app.css"><link rel="icon" type="image/png" sizes="32x32" href="logo/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="logo/favicon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png"></head><body class="customer-theme">
<nav class="topnav"><div class="wrap"><a class="brand brandLogo" href="index.html" aria-label="Maldives Liveaboard Booking home"><img src="logo/logo-dark.png" alt="Maldives Liveaboard Booking" width="2171" height="724" decoding="async"></a><div class="links"><a href="index.html#search">Find a yacht</a><button class="utilityButton" type="button" onclick="logout()">Sign out</button></div></div></nav>
<main class="section accountPage"><div class="wrap"><div class="eyebrow">Guest account</div><h1 id="accountTitle">My Maldives trips</h1><p id="accountMessage" class="sub" role="status">Loading your account…</p>
<section class="accountSection" aria-labelledby="bookingHeading"><div class="sectionHead"><div><h2 id="bookingHeading">Bookings</h2><p class="sub">Reservations made while signed in and securely claimed trips.</p></div><button id="claimButton" class="btn ghost small" type="button">Claim a booking</button></div><div id="accountBookings" class="accountList"></div></section>
<section class="accountSection" aria-labelledby="savedHeading"><h2 id="savedHeading">Saved yachts</h2><div id="accountSaved" class="grid3"></div></section>
<section class="accountSection" aria-labelledby="supportHeading"><div class="sectionHead"><div><h2 id="supportHeading">Support requests</h2><p class="sub">Follow the status of messages sent from your account.</p></div><button class="btn ghost small" type="button" data-open-support>Contact support</button></div><div id="accountSupport" class="accountList"></div></section></div></main>
<script src="assets/app.js"></script><script src="assets/marketplace.js"></script><script>
const $=id=>document.getElementById(id);let dashboard;
function empty(text){return `<div class="empty">${esc(text)}</div>`}function dateText(value){return value?new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeZone:'UTC'}).format(new Date(value+'T00:00:00Z')):'Date to be confirmed'}
function render(){accountTitle.textContent=`${dashboard.user.name.split(' ')[0]}'s Maldives trips`;accountMessage.textContent='Bookings, saved yachts, reviews and support in one place.';accountBookings.innerHTML=dashboard.bookings.length?dashboard.bookings.map(b=>`<article class="accountRow"><div><span class="tag">${esc(b.mode)}</span><h3>${esc(b.yacht_name)}</h3><p>${esc(b.booking_ref)} · ${dateText(b.start_date)} · ${esc(b.status)}</p></div>${b.review_eligible?`<button class="btn ghost small" data-review="${b.id}" data-yacht="${esc(b.yacht_name)}">Write review</button>`:b.review_status?`<span class="statusPill">Review ${esc(b.review_status)}</span>`:''}</article>`).join(''):empty('No bookings are attached to this account yet.');accountSaved.innerHTML=dashboard.saved_yachts.length?dashboard.saved_yachts.map(y=>yachtCard(y)).join(''):empty('Save a yacht to keep it here.');accountSupport.innerHTML=dashboard.support_requests.length?dashboard.support_requests.map(s=>`<article class="accountRow"><div><h3>${esc(s.subject)}</h3><p>${new Date(s.created_at).toLocaleDateString()} · ${esc(s.status)}</p></div><span class="statusPill">${esc(s.status)}</span></article>`).join(''):empty('No support requests yet.')}
async function loadAccount(){try{dashboard=await api('/api/account/dashboard');const pending=sessionStorage.getItem('atolle_pending_claim');if(pending){try{await api('/api/account/bookings/claim',{method:'POST',body:pending});sessionStorage.removeItem('atolle_pending_claim');dashboard=await api('/api/account/dashboard')}catch{}}render()}catch(error){if(error.status===401){location.href='login.html?next='+encodeURIComponent('account.html');return}accountMessage.textContent=error.message}}
claimButton.onclick=()=>openFormDialog('Claim a booking',`<p>Use the reference and private access token issued when the reservation was made.</p><label>Booking reference<input name="booking_ref" required></label><label>Booking access token<input name="booking_token" required></label>`,async data=>{await api('/api/account/bookings/claim',{method:'POST',body:JSON.stringify(data)});await loadAccount()});document.addEventListener('click',e=>{const button=e.target.closest('[data-review]');if(button)openFormDialog(`Review ${button.dataset.yacht}`,`<label>Rating<select name="rating" required><option value="5">5 — Excellent</option><option value="4">4 — Very good</option><option value="3">3 — Good</option><option value="2">2 — Fair</option><option value="1">1 — Poor</option></select></label><label>Title<input name="title" maxlength="120"></label><label>Your review<textarea name="body" minlength="20" maxlength="4000" required></textarea></label><input type="hidden" name="booking_id" value="${button.dataset.review}">`,async data=>{await api('/api/account/reviews',{method:'POST',body:JSON.stringify(data)});await loadAccount()})});loadAccount();
</script></body></html>
