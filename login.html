<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in — Atollé</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <nav class="topnav"><div class="wrap"><a class="brand" href="index.html">Atollé<small>Maldives by yacht</small></a></div></nav>
  <main class="section"><div class="wrap" style="max-width:560px"><div class="panel">
    <div class="eyebrow">Secure access</div>
    <h1 style="font-size:42px;margin:10px 0">Sign in</h1>
    <p class="sub">Operator and admin tools require an authenticated account when production authentication is enabled.</p>
    <form id="loginForm" class="formgrid" style="margin-top:24px">
      <div id="demoAccounts" class="demoAccounts span2" hidden>
        <div class="muted">Fill in a demo account</div>
        <div id="demoAccountButtons" class="demoAccountButtons"></div>
      </div>
      <div class="control span2"><label for="loginEmail">Email</label><input id="loginEmail" name="email" type="email" autocomplete="username" required></div>
      <div class="control span2"><label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required></div>
      <div class="span2"><button class="btn sea" style="width:100%">Sign in</button><div id="msg" class="muted" style="margin-top:10px"></div></div>
    </form>
    <div class="notice" style="margin-top:20px">Authorized operators and administrators can sign in with credentials issued by the platform.</div>
  </div></div></main>
  <script src="assets/app.js"></script>
  <script>
    const params=new URLSearchParams(location.search);
    (async()=>{try{const health=await api('/api/health');const accounts=Array.isArray(health.demo_accounts)?health.demo_accounts.filter(account=>['admin','vendor'].includes(account?.role)&&typeof account.email==='string'&&typeof account.password==='string'):[];if(!accounts.length)return;for(const account of accounts){const button=document.createElement('button');button.type='button';button.className='btn ghost';button.textContent=account.role==='admin'?'Admin demo':'Vendor demo';button.addEventListener('click',()=>{loginEmail.value=account.email;loginPassword.value=account.password;msg.textContent=''});demoAccountButtons.append(button)}demoAccounts.hidden=false}catch{}})();
    loginForm.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';const d=Object.fromEntries(new FormData(e.target));try{const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify(d)});setAuth(r.token,r.user);const fallback=r.user.role==='admin'?'admin.html':r.user.role==='vendor'?'vendor.html':'index.html';let target=fallback;try{const requested=new URL(params.get('next')||fallback,location.origin);if(requested.origin===location.origin)target=requested.pathname+requested.search+requested.hash}catch{}location.href=target}catch(err){msg.textContent=err.message}});
  </script>
</body>
</html>
