name: CI and staging deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Run verification suite
        run: npm run ci

  deploy-staging:
    name: deploy staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: https://maldivesliveaboardbooking.com
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify static assets
        run: npm run build && npm run check:assets

      - name: Apply staging D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --env staging --remote

      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging

      - name: Verify staging deployment
        env:
          ATOLLE_STAGING_ORIGIN: https://maldivesliveaboardbooking.com
          STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
        run: npm run test:staging

      - name: Record deployment
        if: success()
        env:
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          echo "### Staging deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$DEPLOYED_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://maldivesliveaboardbooking.com" >> "$GITHUB_STEP_SUMMARY"
