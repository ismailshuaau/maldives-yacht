<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment — Atollé</title><link rel="stylesheet" href="assets/app.css"></head><body><nav class="topnav"><div class="wrap"><a class="brand" href="index.html">Atollé<small>Maldives by yacht</small></a></div></nav><main class="wrap" style="max-width:700px;padding-top:70px;padding-bottom:100px"><section class="bookingBox"><div class="eyebrow">BML Connect</div><h1 style="font-size:34px;margin:8px 0">Payment status</h1><div id="status"><p class="sub">Checking your payment…</p></div><div id="demoActions" style="display:none;margin-top:20px"><p class="sub">This project is running in BML mock mode. Use these controls to simulate the result returned by BML.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button id="demoPaid" class="btn sea">Simulate successful payment</button><button id="demoCancel" class="btn ghost">Simulate cancelled payment</button></div></div><p style="margin-top:24px"><a class="btn ghost" href="index.html">Return to marketplace</a></p></section></main><script src="assets/app.js"></script><script>
const qs=new URLSearchParams(location.search),pid=qs.get('payment_id'),demo=qs.get('demo')==='1',paymentToken=qs.get('payment_token'),paymentHeaders={'X-Payment-Token':paymentToken||''};
if(paymentToken)history.replaceState(null,'',`${location.pathname}?payment_id=${encodeURIComponent(pid||'')}&demo=${demo?'1':'0'}`);
async function show(){if(!pid||!paymentToken){status.innerHTML='<p class="danger">No valid payment reference was supplied.</p>';return}try{const p=await api('/api/payments/'+pid,{headers:paymentHeaders});status.innerHTML=`<div class="infoGrid"><div class="infoCell"><small>Reference</small><strong>${esc(p.provider_reference||'Pending')}</strong></div><div class="infoCell"><small>Amount</small><strong>${money(p.amount)} ${esc(p.currency)}</strong></div><div class="infoCell"><small>Status</small><strong>${esc(p.status)}</strong></div></div>${p.status==='paid'?'<p class="verified" style="margin-top:18px">Payment completed successfully. Your booking is marked as paid.</p>':''}`;if(demo&&p.status!=='paid')demoActions.style.display='block'}catch(e){status.innerHTML=`<p class="danger">${esc(e.message)}</p>`}}
async function finish(s){await api('/api/payments/demo-complete',{method:'POST',headers:paymentHeaders,body:JSON.stringify({payment_id:+pid,status:s})});demoActions.style.display='none';show()}
demoPaid?.addEventListener('click',()=>finish('paid'));demoCancel?.addEventListener('click',()=>finish('cancelled'));show();
</script></body></html>
